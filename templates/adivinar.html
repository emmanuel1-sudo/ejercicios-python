<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Adivina el número</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>Ejercicio 3</h1>

        <p>Adivina el número</p>

    </header>


    <main>

        <section class="ejercicio">

            <h2>Adivina el número secreto</h2>

            <p>
                El número está entre 1 y 100.
            </p>


            <form method="POST">

                <input
                    type="number"
                    name="intento"
                    min="1"
                    max="100"
                    placeholder="Escribe tu intento"
                    required
                >

                <button type="submit">
                    Adivinar
                </button>

            </form>


            {% if mensaje %}

                <div class="resultado">

                    {{ mensaje }}

                </div>

            {% endif %}


            <a href="/reiniciar"
               class="reiniciar">

                Nuevo juego

            </a>


            <br>


            <a href="/" class="volver">
                ← Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
