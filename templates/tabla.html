<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tabla de multiplicar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>Ejercicio 2</h1>

        <p>Tabla de multiplicar</p>

    </header>


    <main>

        <section class="ejercicio">

            <h2>Generar tabla</h2>

            <form method="POST">

                <input
                    type="number"
                    name="numero"
                    placeholder="Ingresa un número"
                    required
                >

                <button type="submit">
                    Generar tabla
                </button>

            </form>


            {% if tabla %}

                <div class="resultado">

                    <h3>
                        Tabla del {{ numero_tabla }}
                    </h3>

                    {% for linea in tabla %}

                        <p>
                            {{ linea }}
                        </p>

                    {% endfor %}

                    <strong class="guardado">
                        ✓ Guardada en MariaDB
                    </strong>

                </div>

            {% endif %}


            <a href="/" class="volver">
                ← Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
