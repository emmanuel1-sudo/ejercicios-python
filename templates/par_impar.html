<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Par o Impar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>Ejercicio 1</h1>

        <p>Par o Impar</p>

    </header>


    <main>

        <section class="ejercicio">

            <h2>Comprobar número</h2>

            <form method="POST">

    <input
        type="number"
        name="numero"
        step="1"
        placeholder="Ingresa un número entero"
        required
    >

    <button type="submit">
        Comprobar
    </button>

</form>


{% if error %}

    <div class="error">
        {{ error }}
    </div>

{% endif %}


{% if resultado %}

    <div class="resultado">
        {{ resultado }}
    </div>

{% endif %}


            <a href="/" class="volver">
                ← Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
